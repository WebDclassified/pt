name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static gates (types, lint, contrast, secrets)
        run: npm run validate:fast

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build production bundle
        run: npm run build

      - name: E2E — full QA matrix (Chromium, Firefox, WebKit, mobile)
        run: npm run test:e2e
        env:
          QA_MATRIX: "1"

      - name: Performance audit (production server)
        run: node scripts/perf-audit.mjs
        env:
          NEXT_SKIP_BUILD: "1"

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
